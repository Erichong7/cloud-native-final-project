# K8s에 올리기 전에 myserver01에서 컨테이너만으로 동작을 확인하는 용도
#   cd local-test && docker compose up --build
#   → http://<myserver01>:8080 (Mac에서는 VirtualBox 포트포워딩 필요)
# DB는 노드에 설치한 PostgreSQL(10.0.2.3:5432)을 그대로 사용한다.
services:
  backend:
    build: ../backend
    environment:
      DB_HOST: ${DB_HOST:-10.0.2.3}
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-mysecretpassword}

  frontend:
    build: ../frontend

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [backend, frontend]
