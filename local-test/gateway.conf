# 로컬 테스트 전용: K8s Ingress와 똑같이 경로로 나눠준다
#   /api → backend,  / → frontend
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
