# kube-prometheus-stack(12주차)이 설치되어 있어야 이 리소스 종류(CRD)가 존재한다.
# 12주차 my-values.yaml에서 serviceMonitorSelectorNilUsesHelmValues: false 로 바꿨기 때문에
# release 라벨 없이도 Prometheus가 이 ServiceMonitor를 인식한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: board
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
