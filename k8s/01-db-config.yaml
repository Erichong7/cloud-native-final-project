# DB 접속 정보
# - ConfigMap: 민감하지 않은 값
# - Secret   : 계정/비밀번호
#   (stringData로 쓰면 K8s가 base64로 저장한다. Git에 평문으로 올라가므로 보고서 제한사항에 기재)
apiVersion: v1
kind: ConfigMap
metadata:
  name: board-db-config
  namespace: board
data:
  DB_HOST: "10.0.2.3"       # PostgreSQL이 설치된 노드(myserver01) IP
  DB_PORT: "5432"
  DB_NAME: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: board-db-secret
  namespace: board
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: mysecretpassword
