# 하나의 진입점(ingress-nginx, MetalLB IP 10.0.2.20)으로 들어온 요청을 경로로 분배
#   /api/... → backend Service
#   /...     → frontend Service
# Mac에서는 VirtualBox 포트포워딩(호스트 2000 → 10.0.2.20:80)으로 http://localhost:2000 접속
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: board-ingress
  namespace: board
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
