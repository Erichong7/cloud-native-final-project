# main 브랜치에 push → 이미지 빌드 → Docker Hub push → k8s 매니페스트 이미지 태그 갱신(commit)
# → ArgoCD가 Git 변경을 감지해서 클러스터에 자동 배포
name: CI - build and update manifests

on:
  push:
    branches: [main]
    paths-ignore:          # 매니페스트·문서만 바뀐 push는 빌드하지 않음
      - "k8s/**"
      - "argocd/**"
      - "grafana/**"
      - "**.md"
  workflow_dispatch:       # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write          # 매니페스트 태그 갱신 커밋을 push하기 위해 필요

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx (빌드 캐시 사용)
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=backend     # Gradle 의존성 레이어 재사용 → 두 번째 빌드부터 빨라짐
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/board-backend:${{ env.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/board-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/board-frontend:${{ env.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/board-frontend:latest

      - name: Update image tags in k8s manifests
        run: |
          sed -i -E "s|image: .*/board-backend:.*|image: ${DOCKERHUB_USERNAME}/board-backend:${TAG}|"   k8s/10-backend.yaml
          sed -i -E "s|image: .*/board-frontend:.*|image: ${DOCKERHUB_USERNAME}/board-frontend:${TAG}|" k8s/20-frontend.yaml
          sed -i -E "s|value: \".*\"  # APP_VERSION|value: \"${TAG}\"  # APP_VERSION|" k8s/10-backend.yaml
          grep -n "image:" k8s/10-backend.yaml k8s/20-frontend.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "deploy: ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
