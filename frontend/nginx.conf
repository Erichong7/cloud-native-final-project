# 프론트엔드 nginx는 정적 파일만 서빙한다.
# /api 요청은 K8s Ingress가 백엔드 Service로 직접 보내므로 여기서 프록시하지 않는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # readiness/liveness probe용
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
